<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=300,height=550">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="header">
    <h1>Wingdings Translator</h1>
    <div class="version">v1.2.0</div>
    <div class="language-selector">
      <button id="langBtn" class="lang-btn" title="Switch Language">
        <span id="langText">EN</span>
      </button>
    </div>
  </div>

  <div class="input-section">
    <h3>TEXT → WINGDINGS</h3>
    <textarea id="inputText" placeholder="ENTER TEXT TO CONVERT HERE (MAX 666 CHARS)" maxlength="666"></textarea>
    <div class="char-counter">
      <span id="charCount">0</span> / 666
    </div>
  </div>

  <div class="buttons">
    <button id="convertBtn" class="btn primary">CONVERT</button>
    <button id="mappingBtn" class="btn secondary">CHART</button>
  </div>

  <div id="resultSection" class="result-box" style="display:none;">
    <h4>RESULT:</h4>
    <p id="resultText"></p>
  </div>

  <hr>

  <div class="section">
    <h3>WINGDINGS → TEXT</h3>
    <textarea id="wingdingsInput" placeholder="PASTE WINGDINGS HERE" rows="4"></textarea>
    <button id="convertFromBtn" class="btn primary">REVERSE CONVERT</button>
    <div id="reverseResultSection" class="result-box" style="display:none;">
      <h4>REVERSE RESULT:</h4>
      <p id="reverseResultText"></p>
    </div>
  </div>

  <div class="page-actions">
    <hr>
    <h3>PAGE ACTIONS</h3>
    <div class="setting-item">
      <label for="autoConvertCheckbox">
        <input type="checkbox" id="autoConvertCheckbox">
        ページヨミコミジドウヘンカン
      </label>
    </div>
    <button id="convertPageBtn" class="page-btn">CONVERT ENTIRE PAGE</button>
    <button id="revertPageBtn" class="page-btn">REVERT</button>
  </div>

  <div class="dictionary-section">
    <hr>
    <h3>コジンジショ</h3>
    <div class="stats" id="dictStats">
      LOADING...
    </div>
    <button id="dictionaryBtn" class="btn secondary">ジショカンリ</button>
  </div>

  <div class="footer">
    <div class="links">
      <a href="#" id="helpLink">HELP</a> |
      <a href="#" id="aboutLink">ABOUT</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
