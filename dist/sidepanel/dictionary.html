<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>コジンジショカンリ</title>
  <link rel="stylesheet" href="dictionary.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>コジンジショ</h1>
      <div class="stats">
        <span id="wordCount">0</span> / 5000 ゴ
      </div>
    </header>

    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="ジショヲケンサク...">
    </div>

    <div id="wordList" class="word-list">
      <!-- タンゴハココニドウテキニツイカサレマス -->
    </div>

    <div class="add-word-form">
      <h2>アタラシイタンゴヲツイカ</h2>
      <div class="form-row">
        <input type="text" id="newWordKanji" placeholder="タンゴ (レイ: 彗星)">
        <input type="text" id="newWordReading" placeholder="ヨミ (レイ: すいせい)">
      </div>
      <button id="addWordBtn">ツイカ</button>
    </div>

  </div>
  <script src="dictionary.js"></script>
</body>
</html>
